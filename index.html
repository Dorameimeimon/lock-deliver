  .legend .y { color:#a16207; font-weight:600; }

// 返回 1/2/2.5/5/10 × 10^k 形式的“整齐”刻度步长；roundUp=true 时取不小于 x 的最小值
function niceNum(x, roundUp){
  if (x <= 0) return 1;
  const pow = Math.pow(10, Math.floor(Math.log10(x)));
  const f = x / pow;
  let nf;
  if (roundUp){
    if (f <= 1) nf = 1; else if (f <= 2) nf = 2; else if (f <= 2.5) nf = 2.5;
    else if (f <= 5) nf = 5; else nf = 10;
  } else {
    if (f < 1.5) nf = 1; else if (f < 3) nf = 2; else if (f < 4) nf = 2.5;
    else if (f < 7.5) nf = 5; else nf = 10;
  }
  return nf * pow;
}

function renderChart(data, months, chartId, legendId){
  const d = data;
  const cont = document.getElementById(chartId);
  const W = Math.max(cont.clientWidth || 1000, 320);
  const H = 300;
  const padL = 52, padR = 18, padT = 30, padB = 56;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  let vals = [];
  d.shares.forEach(s => months.forEach(m => { const v = s.values[m]; if (v!==null) vals.push(v); }));
  const vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
  const yPad = Math.max((vmax - vmin) * 0.12, 2);
  let lo = vmin - yPad; if (lo < 0) lo = 0;
  const hi = vmax + yPad;
  let yStep = niceNum((hi - lo) / 5, true);
  let yMin = Math.floor(lo / yStep) * yStep;
  let yMax = Math.ceil(hi / yStep) * yStep;
  // 控制刻度数量（最多 8 条），必要时放大步长
  let tickCount = Math.round((yMax - yMin) / yStep);
  while (tickCount > 8){
    yStep = niceNum(yStep * 2, true);
    yMin = Math.floor(lo / yStep) * yStep;
    yMax = Math.ceil(hi / yStep) * yStep;
    tickCount = Math.round((yMax - yMin) / yStep);
  }
  if (yMax - yMin < yStep) yMax = yMin + yStep;

  const n = months.length;
  const xFor = i => n===1 ? padL+plotW/2 : padL + (i/(n-1))*plotW;
  const yFor = v => padT + (1 - (v - yMin)/(yMax - yMin))*plotH;
  const nf = x => x.toFixed(1);

  let svg = `<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" role="img">`;
  // horizontal grid + y labels (自适应)
  for (let k=0; k<=tickCount; k++){
    const v = yMin + k*yStep;
    const y = yFor(v);
    svg += `<line x1="${padL}" y1="${nf(y)}" x2="${nf(padL+plotW)}" y2="${nf(y)}" stroke="#eef1f6" stroke-width="1"/>`;
    const lbl = Number.isInteger(v) ? v : v.toFixed(1);
    svg += `<text x="${padL-8}" y="${nf(y+4)}" text-anchor="end" font-size="10" fill="#9aa6b8">${lbl}</text>`;
  }
  // x axis baseline
  svg += `<line x1="${padL}" y1="${nf(padT+plotH)}" x2="${nf(padL+plotW)}" y2="${nf(padT+plotH)}" stroke="#dde3ec" stroke-width="1.5"/>`;
  // x labels
  const xb = H-padB+16;
  months.forEach((m,i)=>{
    const x = xFor(i);
    svg += `<text x="${nf(x)}" y="${nf(xb)}" transform="rotate(-38 ${nf(x)} ${nf(xb)})" text-anchor="end" font-size="10" fill="#7a8699">${m}</text>`;
  });

  // lines + points（0% 月份不绘制点位与连线，仅保留有数据的部分）
  d.shares.forEach((s, idx)=>{
    const color = PALETTE[idx % PALETTE.length];
    let pts = [];
    months.forEach((m,i)=>{
      const v = s.values[m];
      if (v===null || v===0) return;
      pts.push([xFor(i), yFor(v)]);
    });
    if (pts.length){
      const poly = pts.map(p=>nf(p[0])+","+nf(p[1])).join(" ");
      svg += `<polyline points="${poly}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
      pts.forEach(p=>{
        svg += `<circle cx="${nf(p[0])}" cy="${nf(p[1])}" r="3" fill="${color}" stroke="#fff" stroke-width="1.4"/>`;
      });
    }
  });

  // value labels (per month) with vertical collision avoidance
  const minGap = 15;
  for (let i=0;i<n;i++){
    const x = xFor(i);
    let col = [];
    d.shares.forEach((s, idx)=>{
      const v = s.values[months[i]];
      if (v===null || v===0) return;
      col.push({idx, v, y: yFor(v)});
    });
    col.sort((a,b)=> a.y - b.y); // top (smaller y) first
    let lastLabelY = -Infinity;
    col.forEach(p=>{
      let ly = p.y - 11;
      if (lastLabelY !== -Infinity && ly < lastLabelY + minGap){
        ly = lastLabelY + minGap; // push down to avoid overlap
      }
      lastLabelY = ly;
      const color = PALETTE[p.idx % PALETTE.length];
      let anchor = "middle", lx = x;
      if (i===0){ anchor = "start"; lx = x + 3; }
      else if (i===n-1){ anchor = "end"; lx = x - 3; }
      svg += `<text x="${nf(lx)}" y="${nf(ly+4)}" text-anchor="${anchor}" font-size="12" font-weight="600" fill="${color}" style="paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;">${p.v.toFixed(1)}</text>`;
    });
  }
  svg += `</svg>`;
  cont.innerHTML = svg;

  // legend above
  let legendHtml = "";
  d.shares.forEach((s, idx)=>{
    const color = PALETTE[idx % PALETTE.length];
    legendHtml += `<span><i style="background:${color}"></i>${s.name}</span>`;
  });
  document.getElementById(legendId).innerHTML = legendHtml;
}

function renderTable(headEl, bodyEl, cgEl, data, city, months, cornerLabel){
  // 列宽
  let cgh = '<col class="col-lbl">';
  for (let i=0;i<months.length;i++) cgh += '<col class="col-m">';
  cgEl.innerHTML = cgh;
  // 表头
  headEl.innerHTML = "";
  const corner = document.createElement("th");
  corner.className = "corner"; corner.textContent = cornerLabel;
  headEl.appendChild(corner);
  months.forEach(m => { const th = document.createElement("th"); th.textContent = m; headEl.appendChild(th); });
  // 表体
  bodyEl.innerHTML = "";
  const trCity = document.createElement("tr"); trCity.className = "cityrow";
  const cLbl = document.createElement("th"); cLbl.className="lbl"; cLbl.textContent = city; cLbl.title = city; trCity.appendChild(cLbl);
  months.forEach(m => {
    const v = data.city_total[m];
    const td = document.createElement("td"); td.textContent = (v===0) ? "" : fmt(v); trCity.appendChild(td);
  });
  bodyEl.appendChild(trCity);

  data.groups.forEach(g => {
    const trG = document.createElement("tr");
    const lblG = document.createElement("th"); lblG.className="lbl"; lblG.textContent = g.name; lblG.title = g.name; trG.appendChild(lblG);
    months.forEach(m => {
      const v = g.values[m];
      const td = document.createElement("td"); td.textContent = (v===0) ? "" : fmt(v); trG.appendChild(td);
    });
    bodyEl.appendChild(trG);
  });

  data.shares.forEach(s => {
    const trS = document.createElement("tr"); trS.className = "sharerow";
    const lblS = document.createElement("th"); lblS.className="lbl"; lblS.textContent = s.name; lblS.title = s.name + " 占比"; trS.appendChild(lblS);
    months.forEach(m => {
      const v = s.values[m];
      const td = document.createElement("td"); td.textContent = (v===null || v===0) ? "" : (v.toFixed(1) + "%"); trS.appendChild(td);
    });
    bodyEl.appendChild(trS);
  });
}

function render(){
  const city = citySel.value;
  const d = PIVOT[city];
  const months = getRange();
  const summary = document.getElementById("summary");

  renderTable(document.getElementById("headLock"), document.getElementById("bodyLock"), document.getElementById("cgLock"), d.lock, city, months, "锁单");
  renderTable(document.getElementById("headDeliver"), document.getElementById("bodyDeliver"), document.getElementById("cgDeliver"), d.deliver, city, months, "交付");

  summary.innerHTML = "已选城市：<b>"+city+"</b> ｜ 集团数：<b>"+d.lock.groups.length+"</b> ｜ 时间范围：<b>"+months[0]+" ~ "+months[months.length-1]+"</b>";

  document.getElementById("titleLock").textContent = city + "各集团锁单占比（%）";
  document.getElementById("titleDeliver").textContent = city + "各集团交付占比（%）";

  renderChart(d.lock, months, "chartLock", "chartLegendLock");
  renderChart(d.deliver, months, "chartDeliver", "chartLegendDeliver");
}

citySel.addEventListener("change", render);
startSel.addEventListener("change", render);
endSel.addEventListener("change", render);
window.addEventListener("resize", render);
render();
</script>
